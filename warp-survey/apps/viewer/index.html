<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warp Survey Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #1a1a1a;
        color: #e8e8ea;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      .controls {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(10, 10, 12, 0.8);
        padding: 12px 16px;
        border-radius: 6px;
        border: 1px solid rgba(100, 100, 100, 0.3);
        font-size: 12px;
        z-index: 50;
        max-width: 250px;
      }
      input {
        width: 100%;
        padding: 8px;
        margin: 8px 0;
        border: 1px solid rgba(100, 100, 100, 0.3);
        border-radius: 4px;
        background: rgba(30, 30, 30, 0.8);
        color: #e8e8ea;
        font-size: 12px;
      }
      button {
        padding: 8px 16px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        margin-top: 8px;
        width: 100%;
      }
      button:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div class="controls">
        <div style="margin-bottom: 8px">Manifest URL:</div>
        <input
          type="text"
          id="manifestUrl"
          placeholder="Enter manifest URL or use demo"
          value="/demo/manifest.json"
        />
        <button onclick="loadViewer()">Load Visualization</button>
      </div>
    </div>

    <script type="module">
      import { SurveyViewer } from "./src/survey-viewer.ts";

      let viewer = null;

      window.loadViewer = async () => {
        const input = document.getElementById("manifestUrl");
        const manifestUrl = input.value;

        if (!manifestUrl) {
          alert("Please enter a manifest URL");
          return;
        }

        const canvas = document.getElementById("canvas");
        viewer?.destroy();
        viewer = new SurveyViewer(canvas);

        try {
          await viewer.load(manifestUrl);
        } catch (error) {
          console.error("Failed to load:", error);
          alert("Failed to load visualization: " + error.message);
        }
      };

      // Auto-load on page load
      window.addEventListener("load", () => {
        document.getElementById("manifestUrl").value ||
          (document.getElementById("manifestUrl").value = "/demo/manifest.json");
        window.loadViewer();
      });
    </script>
  </body>
</html>
