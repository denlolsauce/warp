[project]
name = "portal-pipeline"
version = "0.1.0"
description = "Portal capture-to-splat processing pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "plyfile>=1.1.5",
    "pycolmap>=4.1.1",
]

[project.scripts]
portal-pipeline = "portal_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portal_pipeline"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
